# GenBook 排版配置文件
# 修改此文件即可自定义输出 PDF 的字体、字号、排版等参数
#
# 港台现代竖版书籍参考标准（联经、三民、九歌等出版社 B5 菊版）：
#   纸张：JIS-B5 182x257mm
#   天头：约 15mm（现代书），古籍才用 25mm+
#   地脚：约 18mm
#   装订边：约 18mm
#   书口边：约 13mm
#   正文字号：11pt，约 22~23 字/列
#   列间距：4pt

# -- 字体 ----------------------------------------------------------
font_family: "STKaiTi"
font_path: "fonts/STKAITI.TTF"

# -- 字号 ----------------------------------------------------------
font_size: 14
note_font_size: 7.5
# line_spacing: 字间距(pt)
#   0  = 自动，取 font_size × 20%（标准出版行距，推荐）
#   正数 = 手动指定额外字间距 pt，如 3 表示每字格多出 3pt 高度
line_spacing: 0

# -- 列间距 --------------------------------------------------------
column_spacing: 5

# -- 旧版 PDF writer 页边距（兼容保留，单位 pt）-------------------
page_margin:
  top: 20
  bottom: 20
  left: 20
  right: 20

# -- 古籍/竖版排版核心配置 -----------------------------------------
guji_layout:
  enabled: true
  # template: blank=现代竖版 | classic=经典古籍（后期）
  template: "blank"

  # 纸张
  paper: "jis-b5"
  page_width_mm: 182
  page_height_mm: 257

  # -- 版面留白（单位 mm）-----------------------------------------
  # 版心宽 = 182 - 18 - 13 = 151mm
  # 版心高 = 257 - 15 - 18 = 224mm
  tian_tou_mm: 40
  di_jiao_mm: 30
  zhuang_ding_mm: 10
  shu_kou_mm: 20

  # -- 列参数 -----------------------------------------------------
  char_per_col: 22
  reserve_empty_cols: 0
  note_col_ratio: 0.65

  # -- 列类型判断阈值 ------------------------------------------
  # note_max_chars: 字数<=此值 且 cx<=页宽*note_cx_ratio => 注文列
  # note_cx_ratio:  注文列cx位置上限（页宽比例，注文夹在正文列中）
  # title_max_chars: 字数<=此值（且不满足注文条件）=> 标题列
  note_gap_ratio:  0.55  # 注文列间距阈值比例（邻列间距<中位数×此值→注文列）
  note_max_chars:  6
  note_cx_ratio:   0.85
  title_max_chars: 12

  # -- 页码 -------------------------------------------------------
  show_page_num: true
  page_num_style: "chinese"

  # -- 天头书名/卷次（留空则不显示）-------------------------------
  header_title: ""
  header_volume: ""

  # -- 装订方向 ---------------------------------------------------
  binding_style: "modern_vertical"

  # -- dy snap 对齐阈值（字数）------------------------------------
  snap_chars: 2

page_size: "original"
writing_mode: "vertical-rl"
image_scale: 1.0
ocr_confidence_threshold: 0.7
