# GenBook 排版配置文件
# 修改此文件即可自定义输出 PDF 的字体、字号、排版等参数
#
# 港台现代竖版书籍参考标准（联经、三民、九歌等出版社 B5 菊版）：
#   纸张：JIS-B5 182x257mm
#   天头：约 15mm（现代书），古籍才用 25mm+
#   地脚：约 18mm
#   装订边：约 18mm
#   书口边：约 13mm
#   正文字号：11pt，约 22~23 字/列
#   列间距：4pt

# -- 字体 ----------------------------------------------------------
font_family: "STKaiTi"
font_path: "fonts/STKAITI.TTF"

# -- 字号 ----------------------------------------------------------
font_size: 14
note_font_size: 7.5
# line_spacing: 字间距(pt)
#   0  = 自动，取 font_size × 20%（标准出版行距，推荐）
#   正数 = 手动指定额外字间距 pt，如 3 表示每字格多出 3pt 高度
line_spacing: 0

# -- 列间距 --------------------------------------------------------
column_spacing: 5

# -- 旧版 PDF writer 页边距（兼容保留，单位 pt）-------------------
page_margin:
  top: 20
  bottom: 20
  left: 20
  right: 20

# -- 古籍/竖版排版核心配置 -----------------------------------------
guji_layout:
  enabled: true
  # template: blank=现代竖版 | classic=经典古籍（后期）
  template: "blank"

  # 纸张
  paper: "jis-b5"
  page_width_mm: 182
  page_height_mm: 257

  # -- 版面留白（单位 mm）-----------------------------------------
  # 版心宽 = 182 - 18 - 13 = 151mm
  # 版心高 = 257 - 15 - 18 = 224mm
  tian_tou_mm: 40
  di_jiao_mm: 30
  zhuang_ding_mm: 30
  shu_kou_mm: 30

  # -- 列参数 -----------------------------------------------------
  char_per_col: 22
  reserve_empty_cols: 0
  note_col_ratio: 0.65

  # -- 列类型判断阈值 ------------------------------------------
  # note_max_chars: 字数<=此值 且 cx<=页宽*note_cx_ratio => 注文列
  # note_cx_ratio:  注文列cx位置上限（页宽比例，注文夹在正文列中）
  # title_max_chars: 字数<=此值（且不满足注文条件）=> 标题列
  note_gap_ratio:  0.55  # 注文列间距阈值比例（邻列间距<中位数×此值→注文列）
  note_max_chars:  6
  note_cx_ratio:   0.85
  title_max_chars: 12

  # -- 页码 -------------------------------------------------------
  show_page_num: false
  # page_num_offset: 正文起始页的物理页号
  #   例如 5 表示第5页显示页码1，前4页无页码；0或1表示从第1页开始编页码
  page_num_offset: 3
  page_num_style: "arabic"

  # -- 天头书名/卷次（留空则不显示）-------------------------------
  header_title: ""
  header_volume: ""

  # -- 装订方向 ---------------------------------------------------
  binding_style: "modern_vertical"

  # -- dy snap 对齐阈值（字数）------------------------------------
  snap_chars: 2

  # ── 版面元素字号（单位：相对正文 font_size 的倍率，0=禁用）----------
  # 修改这里的值，生成的 .typ 文件里对应的 #let 变量会自动更新。
  # 在 .typ 文件中使用：将 fw: cw 替换为 fw: title_fw 等。
  styles:
    # 正文（主体文字）
    main_scale:      1.00   # 正文字号 = font_size × 1.00
    # 篇章大標題（如"第一章"、书名大字）
    heading_scale:   1.50   # 大標 = font_size × 1.50  → 21pt
    # 節標題（章节内部标题）
    title_scale:     1.30   # 標題 = font_size × 1.30  → 18.2pt
    # 副標題（标题下方的说明行）
    subtitle_scale:  1.00   # 副標 = font_size × 1.00  → 14pt（同正文）
    # 著者 / 撰者行
    author_scale:    0.80   # 著者 = font_size × 0.80  → 11.2pt
    # 注疏 / 疏文（随文解說，略小于正文）
    interp_scale:    0.80   # 疏文 = font_size × 0.80  → 11.2pt
    # 夾注（雙行小字，通常是正文的一半）
    note_scale:      0.54   # 夾注 = font_size × 0.54  → 7.5pt（≈½正文）
    # 頁碼
    pagenum_scale:   0.70   # 頁碼 = font_size × 0.70  → 9.8pt

page_size: "original"
writing_mode: "vertical-rl"
image_scale: 1.0
ocr_confidence_threshold: 0.7
