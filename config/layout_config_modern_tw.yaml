# GenBook 排版配置 — 三民書局古籍竖版「常規版」規格
#
# ══════════════════════════════════════════════════════════════
#  規格依據：三民書局古籍口袋本實測（《四書集注》《史記》等）
#  ────────────────────────────────────────────────────────────
#
#  「常規版」（本檔預設）         「大字版」（到各參數旁註釋）
#  ───────────────────   ─────────────────────
#  紙張  JIS-B5  182×257 mm       同左
#  天頭  20 mm                  54 mm（大天頭古籍風）
#  地脚  20 mm                  37 mm
#  裝訂  18 mm                  30 mm
#  書口  13 mm                  10 mm
#  版心  151×217 mm (428×615 pt)  142×166 mm (403×470 pt)
#  字號  12 pt (≈4.23 mm)            23 pt (≈8.11 mm)
#  列間距 4 pt                    4 pt
#  容列  ≈ 26 列                     ≈ 14 列
#  容字  ≈ 42 字/列                  ≈ 17 字/列
# ══════════════════════════════════════════════════════════════

# -- 字體 ----------------------------------------------------------
# 三民古籍常規版常用標楷體或明朝體；
# 安裝思源宋體（SourceHanSerifTC）輸出更正式
font_family: "STKaiTi"
font_path:   "fonts/STKAITI.TTF"
# font_family: "SourceHanSerifTC"
# font_path:   "fonts/SourceHanSerifTC-Regular.otf"

# -- 字號 ----------------------------------------------------------
# 常規版：12 pt（≈4.23 mm）— 三民密排口袋本實測字號
#
# 可選值對照：
#   12 pt ≈ 4.23 mm — 常規版（本檔預設）
#   16 pt ≈ 5.64 mm — 一般大字本
#   20 pt ≈ 7.06 mm — 中字大字本
#   23 pt ≈ 8.11 mm — 大字本（《周易参同契》實測）
font_size:      12      # pt 「大字版改為 23」
note_font_size: 6.0     # pt，夾注小字（font_size × 0.50） 「大字版: 11.5」

# line_spacing: 0 = 自動取 font_size × 20％
#   常規版 12pt → 2.4 pt   「大字版 23pt → 4.6 pt」
line_spacing: 0

# -- 列間距 --------------------------------------------------------
# 常規版/大字版同用 4 pt
column_spacing: 4       # pt  「大字版同」

# -- 旧版 PDF writer 頁邊距（單位 pt）-------------------
# 常規版：                   大字版：
page_margin:
  top:     57  # 20 mm 天頭    「大字版: 153 pt = 54 mm」
  bottom:  57  # 20 mm 地脚    「大字版: 105 pt = 37 mm」
  left:    37  # 13 mm 書口邂  「大字版:  28 pt = 10 mm」
  right:   51  # 18 mm 裝訂邂  「大字版:  85 pt = 30 mm」

# -- 古籍/竖版排版核心配置 -----------------------------------------
guji_layout:
  enabled: true
  template: "blank"   # blank=現代竖版 | classic=古籍線框（待實現）

  paper:          "jis-b5"
  page_width_mm:  182
  page_height_mm: 257

  # -- 版面留白（單位 mm）------------------------------------------
  # 常規版：版心 = 182-18-13=151 mm  ×  257-20-20=217 mm
  #              = 428 pt              ×  615 pt
  # 大字版：版心 = 182-30-10=142 mm  ×  257-54-37=166 mm
  tian_tou_mm:    20    # 天頭  「大字版: 54」
  di_jiao_mm:     20    # 地脚  「大字版: 37」
  zhuang_ding_mm: 18    # 裝訂邂  「大字版: 30」
  shu_kou_mm:     13    # 書口邂  「大字版: 10」

  # -- 列參數 -------------------------------------------------------
  # 常規版：428/(12+4)=26.8 → 26列  615/(12×1.2)=42.7 → 42字/列
  # 大字版：403/(23+4)=14.9 → 14列  470/(23×1.2)=17.0 → 17字/列
  char_per_col:       42    # 「大字版: 17」
  reserve_empty_cols: 0
  note_col_ratio:     0.55  # 夾注列寬 = 正文列 × 0.55

  # -- 列類型判斷閾値 -----------------------------------------------
  # 常規版字小加多，閾値稍高
  note_gap_ratio:  0.55
  note_max_chars:  6    # 「大字版: 4」
  note_cx_ratio:   0.85
  title_max_chars: 12   # 「大字版: 8」

  # -- 頁碼 ---------------------------------------------------------
  show_page_num:   true
  page_num_offset: 5    # 封面/目次展頁通常前 4~6 頁
  page_num_style:  "arabic"   # arabic=阿拉伯數字 | chinese=漢字

  # -- 天頭書名／卷次（留空則不顯示）-------------------------------
  header_title:  ""
  header_volume: ""

  # -- 裝訂方向 -----------------------------------------------------
  binding_style: "modern_vertical"   # 右翳書

  # -- dy snap 對齊閾値（字數）-------------------------------------
  snap_chars: 2         # 「大字版建議: 1」

  # ── 版面元素字號倍率（相對正文 font_size）─────────────────────
  # 常規版以 12pt 為基準：              大字版以 23pt 為基準：
  #   篇章大標 1.50 → 18 pt         「大字版: 1.30 → 30 pt」
  #   節標題   1.25 → 15 pt         「大字版: 1.15 → 26.5 pt」
  #   副標題   1.00 → 12 pt         「大字版: 1.00 → 23 pt」
  #   著者行   0.83 → 10 pt         「大字版: 0.87 → 20 pt」
  #   注疏/疏文 0.83 → 10 pt      「大字版: 0.87 → 20 pt」
  #   夾注小字  0.50 →  6 pt         「大字版: 0.50 → 11.5 pt」
  #   頁碼     0.67 →  8 pt         「大字版: 0.52 → 12 pt」
  styles:
    main_scale:      1.00   # 正文  = 12 pt    「大字版: 23 pt」
    heading_scale:   1.50   # 篇章大標 = 18 pt    「大字版: 1.30 = 30 pt」
    title_scale:     1.25   # 節標題   = 15 pt    「大字版: 1.15 = 26.5 pt」
    subtitle_scale:  1.00   # 副標題   = 12 pt    「大字版: 1.00 = 23 pt」
    author_scale:    0.83   # 著者行   = 10 pt    「大字版: 0.87 = 20 pt」
    interp_scale:    0.83   # 注疏/疏文= 10 pt    「大字版: 0.87 = 20 pt」
    note_scale:      0.50   # 夾注小字  =  6 pt    「大字版: 0.50 = 11.5 pt」
    pagenum_scale:   0.67   # 頁碼     =  8 pt    「大字版: 0.52 = 12 pt」

# -- 其他全域設定 --------------------------------------------------
page_size:                "original"
writing_mode:             "vertical-rl"
image_scale:              1.0
ocr_confidence_threshold: 0.7
