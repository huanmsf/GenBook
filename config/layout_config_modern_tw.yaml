# GenBook 排版配置 — 三民書局《周易参同契》大字古籍竖版規格
#
# ══════════════════════════════════════════════════════════════
#  規格依據（掃描稿实測 + 换算到 B5）
#  ────────────────────────────────────────────────────────────
#  紙張：JIS-B5  182 × 257 mm（三民菊版）
#  天頭：54 mm（大天頭古籍風）
#  地脚：37 mm
#  裝訂邂：30 mm
#  書口邂：10 mm
#  → 版心：142 × 166 mm（403 × 470 pt）
#  正文字號：23 pt（大字本，掌心高≈166mm/(23×1.2)pt≈9格/pt=17字）
#  列數：版心寬403pt/(23+4)pt≈15列
# ══════════════════════════════════════════════════════════════

# -- 字體 ----------------------------------------------------------
# 三民古籍系列常用標楷体或明朝体
# 如安裝思源宋體（SourceHanSerifTC）效果更正式
font_family: "STKaiTi"
font_path:   "fonts/STKAITI.TTF"
# font_family: "SourceHanSerifTC"
# font_path:   "fonts/SourceHanSerifTC-Regular.otf"

# -- 字號 ----------------------------------------------------------
# 三民《周易参同契》大字本，掃描实測字體换算到 B5 約 23pt
# 對比參考：
#   16pt ≈ 5.64mm — 一般古籍小字本
#   20pt ≈ 7.06mm — 中字本
#   23pt ≈ 8.11mm — 本書实測（三民大字本）
#   28pt ≈ 9.88mm — 大字老年版
font_size:      23      # pt
note_font_size: 11.5    # pt，夾注小字（font_size × 0.50）

# line_spacing: 0 = 自動取 font_size×20％ = 4.6pt
line_spacing: 0

# -- 列間距 --------------------------------------------------------
# 大字本列間距常用 4~6pt
column_spacing: 4

# -- 旧版 PDF writer 頁邊距（單位 pt）-------------------
page_margin:
  top:    153  # 54mm 天頭
  bottom: 105  # 37mm 地脚
  left:    28  # 10mm 書口邂（外側）
  right:   85  # 30mm 裝訂邂（內側）

# -- 古籍/竖版排版核心配置 -----------------------------------------
guji_layout:
  enabled: true
  template: "blank"

  paper:          "jis-b5"
  page_width_mm:  182
  page_height_mm: 257

  # -- 版面留白（mm）----------------------------------------------
  # 版心寬 = 182 - 30 - 10 = 142 mm = 403 pt
  # 版心高 = 257 - 54 - 37 = 166 mm = 470 pt
  tian_tou_mm:    54    # 天頭（大天頭古籍風，寫訪抖或書名標題用）
  di_jiao_mm:     37    # 地脚
  zhuang_ding_mm: 30    # 裝訂邂（內側）
  shu_kou_mm:     10    # 書口邂（外側）

  # -- 列參數 -------------------------------------------------------
  # 版心寬 403pt，字格 23pt+4pt間距=27pt → 容列 403/27=14.9 → 取 14
  # 版心高 470pt，字格高 23×1.2=27.6pt → 容字 470/27.6=17.0 → 取 17
  char_per_col:       17
  reserve_empty_cols: 0
  note_col_ratio:     0.55   # 夾注列寬 = 正文列 × 0.55

  # -- 列類型判斷閾値 -----------------------------------------------
  note_gap_ratio:  0.50
  note_max_chars:  4
  note_cx_ratio:   0.85
  title_max_chars: 8

  # -- 頁碼 ---------------------------------------------------------
  show_page_num:   true
  page_num_offset: 5
  page_num_style:  "arabic"

  # -- 天頭書名／卷次（留空則不顯示）-------------------------------
  header_title:  ""
  header_volume: ""

  # -- 裝訂方向 -----------------------------------------------------
  binding_style: "modern_vertical"

  # -- dy snap 對齊閾値（字數）-------------------------------------
  snap_chars: 1

  # ── 版面元素字號倍率（以 23pt 正文為基準）──────────────────
  # 大字本篇章標題常用與正文同身型或稍大（+20％）
  styles:
    main_scale:      1.00   # 正文  = 23.0pt
    heading_scale:   1.30   # 篇章大標   = 30pt（版心最寬一列）
    title_scale:     1.15   # 節標題    = 26.5pt
    subtitle_scale:  1.00   # 副標題    = 23pt（同正文）
    author_scale:    0.87   # 著者行    = 20pt
    interp_scale:    0.87   # 注疏/疏文 = 20pt
    note_scale:      0.50   # 夾注小字  = 11.5pt
    pagenum_scale:   0.52   # 頁碼      = 12pt

# -- 其他全域設定 --------------------------------------------------
page_size:                "original"
writing_mode:             "vertical-rl"
image_scale:              1.0
ocr_confidence_threshold: 0.7
