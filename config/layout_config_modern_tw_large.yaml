# GenBook 排版配置 — 三民書局古籍竖版「大字版」規格
# 參考檔： config/layout_config_modern_tw.yaml（常規版）
#
# ══════════════════════════════════════════════════════════════
#  規格依據：三民《周易参同契》大字本實測（掃描稿實測 → B5 換算）
#  ────────────────────────────────────────────────────────────
#
#  「大字版」（本檔預設）         「常規版」（對照參考）
#  ───────────────────   ─────────────────────
#  紙張  JIS-B5  182×257 mm       同左
#  天頭  54 mm（大天頭古籍風）         20 mm
#  地脚  37 mm                  20 mm
#  裝訂  30 mm                  18 mm
#  書口  10 mm                  13 mm
#  版心  142×166 mm (403×470 pt)  151×217 mm (428×615 pt)
#  字號  23 pt (≈8.11 mm)            12 pt (≈4.23 mm)
#  列間距 4 pt                    4 pt
#  容列  ≈ 14 列                     ≈ 26 列
#  容字  ≈ 17 字/列                  ≈ 42 字/列
# ══════════════════════════════════════════════════════════════

# -- 字體 ----------------------------------------------------------
# 大字本建議用標楷體或清晰的明朝體；
# 安裝思源宋體（SourceHanSerifTC）輸出更正式
font_family: "STKaiTi"
font_path:   "fonts/STKAITI.TTF"
# font_family: "SourceHanSerifTC"
# font_path:   "fonts/SourceHanSerifTC-Regular.otf"

# -- 字號 ----------------------------------------------------------
# 大字本：23 pt（≈8.11 mm）— 三民《周易参同契》實測換算字號
#
# 對照：
#   12 pt ≈ 4.23 mm — 常規版（layout_config_modern_tw.yaml）
#   16 pt ≈ 5.64 mm — 一般大字本
#   20 pt ≈ 7.06 mm — 中字大字本
#   23 pt ≈ 8.11 mm — 本檔預設（《周易参同契》實測）
font_size:      20      # pt  「常規版: 12」
note_font_size: 11    # pt，夾注小字（font_size × 0.50）  「常規版: 6.0」

# line_spacing: 0 = 自動取 font_size × 20％
#   大字版 23pt → 4.6 pt   「常規版 12pt → 2.4 pt」
line_spacing: 0

# -- 列間距 --------------------------------------------------------
# 大字版/常規版同用 4 pt
column_spacing: 6       # pt  「常規版同」

# -- 旧版 PDF writer 頁邊距（單位 pt）-------------------
# 大字版：                   常規版：
page_margin:
  top:    153  # 54 mm 天頭    「常規版:  57 pt = 20 mm」
  bottom: 105  # 37 mm 地脚    「常規版:  57 pt = 20 mm」
  left:    28  # 10 mm 書口邂  「常規版:  37 pt = 13 mm」
  right:   85  # 30 mm 裝訂邂  「常規版:  51 pt = 18 mm」

# -- 古籍/竖版排版核心配置 -----------------------------------------
guji_layout:
  enabled: true
  template: "blank"   # blank=現代竖版 | classic=古籍線框（待實現）

  paper:          "jis-b5"
  page_width_mm:  182
  page_height_mm: 257

  # -- 版面留白（單位 mm）------------------------------------------
  # 大字版：版心 = 182-30-10=142 mm  ×  257-54-37=166 mm
  #              = 403 pt              ×  470 pt
  # 常規版：版心 = 182-18-13=151 mm  ×  257-20-20=217 mm
  tian_tou_mm:    54    # 天頭（大天頭古籍風）  「常規版: 20」
  di_jiao_mm:     20    # 地脚               「常規版: 20」
  zhuang_ding_mm: 30    # 裝訂邂（內側）       「常規版: 18」
  shu_kou_mm:     10    # 書口邂（外側）       「常規版: 13」

  # -- 列參數 -------------------------------------------------------
  # 大字版：403/(23+4)=14.9 → 14列  470/(23×1.2)=17.0 → 17字/列
  # 常規版：428/(12+4)=26.8 → 26列  615/(12×1.2)=42.7 → 42字/列
  char_per_col:       17    # 「常規版: 42」
  reserve_empty_cols: 0
  note_col_ratio:     0.55  # 夾注列寬 = 正文列 × 0.55

  # -- 列類型判斷閾値 -----------------------------------------------
  # 大字本字少列寬，閾値稍低
  note_gap_ratio:  0.50
  note_max_chars:  4    # 「常規版: 6」
  note_cx_ratio:   0.85
  title_max_chars: 8    # 「常規版: 12」

  # -- 頁碼 ---------------------------------------------------------
  show_page_num:   true
  page_num_offset: 3    # 封面/目次展頁通常前 4~6 頁
  page_num_style:  "arabic"   # arabic=阿拉伯數字 | chinese=漢字

  # -- 天頭書名／卷次（留空則不顯示）-------------------------------
  header_title:  ""
  header_volume: ""

  # -- 裝訂方向 -----------------------------------------------------
  binding_style: "modern_vertical"   # 右翳書

  # -- dy snap 對齊閾値（字數）-------------------------------------
  snap_chars: 1         # 「常規版: 2」

  # ── 版面元素字號倍率（相對正文 font_size）─────────────────────
  # 大字版以 23pt 為基準：              常規版以 12pt 為基準：
  #   篇章大標 1.30 → 30 pt         「常規版: 1.50 → 18 pt」
  #   節標題   1.15 → 26.5 pt      「常規版: 1.25 → 15 pt」
  #   副標題   1.00 → 23 pt         「常規版: 1.00 → 12 pt」
  #   著者行   0.87 → 20 pt         「常規版: 0.83 → 10 pt」
  #   注疏/疏文 0.87 → 20 pt      「常規版: 0.83 → 10 pt」
  #   夾注小字  0.50 → 11.5 pt     「常規版: 0.50 →  6 pt」
  #   頁碼     0.52 → 12 pt         「常規版: 0.67 →  8 pt」
  styles:
    main_scale:      1.00   # 正文  = 23 pt    「常規版: 12 pt」
    heading_scale:   1.30   # 篇章大標 = 30 pt    「常規版: 1.50 = 18 pt」
    title_scale:     1.15   # 節標題   = 26.5 pt  「常規版: 1.25 = 15 pt」
    subtitle_scale:  1.00   # 副標題   = 23 pt    「常規版: 1.00 = 12 pt」
    author_scale:    0.87   # 著者行   = 20 pt    「常規版: 0.83 = 10 pt」
    interp_scale:    0.87   # 注疏/疏文= 20 pt    「常規版: 0.83 = 10 pt」
    note_scale:      0.50   # 夾注小字  = 11.5 pt  「常規版: 0.50 =  6 pt」
    pagenum_scale:   0.52   # 頁碼     = 12 pt    「常規版: 0.67 =  8 pt」

# -- 其他全域設定 --------------------------------------------------
page_size:                "original"
writing_mode:             "vertical-rl"
image_scale:              1.0
ocr_confidence_threshold: 0.7
